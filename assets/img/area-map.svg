<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#23261f" flood-opacity="0.10"/>
    </filter>
    <g id="car">
      <rect x="-13" y="-8" width="26" height="17" rx="5" fill="#9cab80"/>
      <rect x="-8" y="-13" width="16" height="9" rx="4" fill="#b7c3a0"/>
      <circle cx="-8" cy="10" r="3.2" fill="#5a6d42"/><circle cx="8" cy="10" r="3.2" fill="#5a6d42"/>
    </g>
    <g id="tree">
      <rect x="-2.5" y="4" width="5" height="14" rx="2" fill="#8a6a2f" opacity=".65"/>
      <circle cy="-4" r="15" fill="#c3cfae"/><circle cx="-9" cy="2" r="10" fill="#cdd8b9"/><circle cx="9" cy="2" r="10" fill="#cdd8b9"/>
    </g>
  </defs>

  <rect width="1120" height="760" rx="26" fill="#faf7f2"/>
  <rect x="8" y="8" width="1104" height="744" rx="20" fill="none" stroke="#e6e1d8" stroke-width="2"/>

  <!-- 中山路一段 -->
  <line x1="440" y1="740" x2="600" y2="-10" stroke="#e7e1d5" stroke-width="54" stroke-linecap="butt"/>
  <line x1="440" y1="740" x2="600" y2="-10" stroke="#ffffff" stroke-width="3" stroke-dasharray="18 16" opacity="0.9"/>
  <g transform="translate(524 300) rotate(-77.5)">
    <rect x="-66" y="-19" width="132" height="30" rx="10" fill="#e7e1d5"/>
    <text y="3" font-size="21" font-weight="700" fill="#6b7268" letter-spacing="3" text-anchor="middle">中山路一段</text>
  </g>

  <!-- 斑馬線 -->
  <g stroke="#ffffff" stroke-width="7" opacity="0.95">
    <line x1="491" y1="408" x2="527" y2="400"/><line x1="495" y1="425" x2="531" y2="417"/>
    <line x1="499" y1="442" x2="535" y2="434"/><line x1="503" y1="459" x2="539" y2="451"/>
  </g>

  <!-- 王爺壟停車場 -->
  <g filter="url(#soft)">
    <rect x="745" y="345" width="222" height="168" rx="16" fill="#eef2e4" stroke="#8da06e" stroke-width="2.5"/>
  </g>
  <g stroke="#cfd9bd" stroke-width="2">
    <line x1="800" y1="398" x2="800" y2="486"/><line x1="856" y1="398" x2="856" y2="486"/><line x1="912" y1="398" x2="912" y2="486"/>
  </g>
  <use href="#car" x="773" y="432"/><use href="#car" x="829" y="446"/><use href="#car" x="885" y="436"/>
  <circle cx="932" cy="378" r="18" fill="#5a6d42"/>
  <text x="932" y="385" font-size="21" font-weight="700" fill="#fff" text-anchor="middle">P</text>
  <text x="856" y="542" font-size="21" font-weight="700" fill="#2e3a22" text-anchor="middle">王爺壟停車場</text>
  <text x="856" y="566" font-size="15" fill="#6b7268" text-anchor="middle">診所大樓後方</text>

  <!-- 君禾診所 -->
  <g filter="url(#soft)">
    <rect x="540" y="366" width="162" height="132" rx="16" fill="#9cab80" stroke="#2e3a22" stroke-width="3"/>
  </g>
  <rect x="540" y="366" width="162" height="30" rx="14" fill="#8da06e"/>
  <text x="621" y="387" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">湖心花園</text>
  <g fill="#ffffff" opacity="0.88">
    <rect x="562" y="414" width="30" height="26" rx="5"/><rect x="606" y="414" width="30" height="26" rx="5"/><rect x="650" y="414" width="30" height="26" rx="5"/>
    <rect x="562" y="454" width="30" height="26" rx="5"/><rect x="650" y="454" width="30" height="26" rx="5"/>
  </g>
  <rect x="606" y="452" width="30" height="30" rx="4" fill="#f2f5eb" stroke="#5a6d42" stroke-width="2"/>
  <text x="621" y="322" font-size="25" font-weight="700" fill="#2e3a22" text-anchor="middle">君禾診所</text>
  <text x="621" y="348" font-size="15" fill="#3d443b" text-anchor="middle">中山路一段 596 號</text>

  <!-- 隔壁大樓（通道夾在兩棟之間） -->
  <g filter="url(#soft)">
    <rect x="540" y="570" width="176" height="86" rx="14" fill="#ffffff" stroke="#d8d2c4" stroke-width="2.5"/>
  </g>
  <rect x="540" y="570" width="176" height="20" rx="10" fill="#efece4"/>
  <text x="628" y="624" font-size="17" font-weight="700" fill="#6b7268" text-anchor="middle">新傳遠景</text>

  <!-- 通道：夾在兩棟大樓中間 -->
  <path d="M744 542 H 508" fill="none" stroke="#eceae2" stroke-width="30" stroke-linecap="round"/>
  <text x="612" y="518" font-size="14" font-weight="700" fill="#8a6a2f" text-anchor="middle">通道（可步行）</text>

  <!-- 從停車場走到診所正門的路線 -->
  <path d="M762 470 C 762 508, 752 542, 730 542 L 522 542 C 510 542, 504 534, 504 522 L 504 486 C 504 476, 512 470, 524 470"
        fill="none" stroke="#d18f40" stroke-width="4" stroke-dasharray="9 8" stroke-linecap="round"/>
  <path d="M542 470 L 524 462 L 524 478 Z" fill="#d18f40"/>
  <circle cx="762" cy="470" r="6" fill="#d18f40"/>
  <!-- 正門 -->
  <rect x="534" y="452" width="10" height="34" rx="3" fill="#f2f5eb" stroke="#2e3a22" stroke-width="2"/>
  <text x="500" y="440" font-size="14" font-weight="700" fill="#2e3a22" text-anchor="middle">正門</text>

  <!-- 星巴克 -->
  <g filter="url(#soft)"><rect x="410" y="66" width="128" height="96" rx="14" fill="#ffffff" stroke="#d8d2c4" stroke-width="2.5"/></g>
  <rect x="410" y="66" width="128" height="22" rx="11" fill="#e3e9d7"/>
  <g transform="translate(474 120)">
    <path d="M-13 -13 h26 l-4 26 a5 5 0 0 1 -5 5 h-8 a5 5 0 0 1 -5 -5 z" fill="none" stroke="#5a6d42" stroke-width="2.6"/>
    <path d="M13 -7 a7 7 0 0 1 0 13" fill="none" stroke="#5a6d42" stroke-width="2.6"/>
  </g>
  <text x="474" y="184" font-size="18" font-weight="700" fill="#2e3a22" text-anchor="middle">星巴克</text>
  <text x="474" y="205" font-size="13" fill="#6b7268" text-anchor="middle">湖口竹笪門市</text>

  <!-- 蝦皮店到店 -->
  <g filter="url(#soft)"><rect x="330" y="318" width="128" height="96" rx="14" fill="#ffffff" stroke="#d8d2c4" stroke-width="2.5"/></g>
  <rect x="330" y="318" width="128" height="22" rx="11" fill="#f5eedf"/>
  <g transform="translate(394 374)">
    <rect x="-18" y="-15" width="36" height="30" rx="4" fill="none" stroke="#8a6a2f" stroke-width="2.6"/>
    <line x1="-18" y1="-4" x2="18" y2="-4" stroke="#8a6a2f" stroke-width="2.6"/>
    <line x1="0" y1="-15" x2="0" y2="-4" stroke="#8a6a2f" stroke-width="2.6"/>
  </g>
  <text x="394" y="436" font-size="18" font-weight="700" fill="#2e3a22" text-anchor="middle">蝦皮店到店</text>
  <text x="394" y="457" font-size="13" fill="#6b7268" text-anchor="middle">湖口湖心店</text>

  <!-- 石二鍋 -->
  <g filter="url(#soft)"><rect x="292" y="510" width="128" height="96" rx="14" fill="#ffffff" stroke="#d8d2c4" stroke-width="2.5"/></g>
  <rect x="292" y="510" width="128" height="22" rx="11" fill="#f5eedf"/>
  <g transform="translate(356 566)">
    <path d="M-19 -3 h38 a5 5 0 0 1 -3 9 l-4 10 h-24 l-4 -10 a5 5 0 0 1 -3 -9 z" fill="none" stroke="#8a6a2f" stroke-width="2.6"/>
    <path d="M-8 -12 q4 -5 0 -10 M8 -12 q4 -5 0 -10" fill="none" stroke="#b08a46" stroke-width="2.2"/>
  </g>
  <text x="356" y="628" font-size="18" font-weight="700" fill="#2e3a22" text-anchor="middle">石二鍋</text>
  <text x="356" y="649" font-size="13" fill="#6b7268" text-anchor="middle">新竹湖口中山店</text>

  <!-- 往車站 -->
  <g stroke="#d18f40" stroke-width="4.5" fill="none" stroke-linecap="round">
    <line x1="646" y1="176" x2="676" y2="92"/>
  </g>
  <path d="M681 76 L668 100 L694 99 Z" fill="#d18f40"/>
  <text x="706" y="104" font-size="17" font-weight="700" fill="#8a6a2f">往台鐵湖口車站</text>
  <text x="706" y="126" font-size="14" fill="#8a6a2f">約 1 公里</text>

  <!-- 指北針 -->
  <g transform="translate(1012 118)">
    <circle r="38" fill="#ffffff" stroke="#e6e1d8" stroke-width="2"/>
    <path d="M0 -24 L9 10 L0 3 L-9 10 Z" fill="#5a6d42"/>
    <text y="-30" font-size="14" font-weight="700" fill="#5a6d42" text-anchor="middle">N</text>
  </g>

  <!-- 行道樹 -->
  <use href="#tree" x="228" y="228"/><use href="#tree" x="222" y="452"/><use href="#tree" x="760" y="646"/>

  <!-- 標題 -->
  <text x="56" y="76" font-size="30" font-weight="700" fill="#2e3a22">君禾診所．周邊地圖</text>
  <text x="56" y="106" font-size="16" fill="#6b7268">新竹縣湖口鄉中山路一段 596 號</text>
  <g transform="translate(56 676)">
    <path d="M0 0 H 46" stroke="#d18f40" stroke-width="4" stroke-dasharray="9 8" stroke-linecap="round"/>
    <text x="58" y="5" font-size="14" fill="#3d443b">從停車場沿兩棟大樓之間的通道步行至診所正門</text>
  </g>
  <text x="56" y="716" font-size="14" fill="#9aa196">※ 示意圖，僅標示相對方位，非按實際比例繪製。</text>
  <text x="1064" y="716" font-size="14" fill="#9aa196" text-anchor="end">君禾診所 harmoniaclinic.net</text>
</svg>
