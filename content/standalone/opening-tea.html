:root{
  --olive:#9CAB80;
  --olive-deep:#6E7F55;
  --olive-shadow:#5D6C46;
  --white:#FFFFFF;
  --ivory:#F3F1E4;
  --hair:rgba(255,255,255,.34);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--olive-deep);
  font-family:'HanSerif','Noto Serif CJK TC','Noto Serif TC','Songti TC','PMingLiU',serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100svh;padding:24px 12px;
}
@media (max-width:600px){body{padding:0}}

.card{
  position:relative;
  width:min(560px,100%);
  padding:clamp(36px,6.8vw,52px) clamp(26px,5.4vw,46px) clamp(32px,6vw,46px);
  background:var(--olive);
  overflow:hidden;
  isolation:isolate;
}
/* soft depth at the edges — keeps the brand olive pure at the centre */
.card::before{
  content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(118% 76% at 50% 30%,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 46%,rgba(93,108,70,.28) 100%);
}
.frame{
  position:absolute;inset:clamp(14px,2.6vw,22px);
  border:1px solid var(--hair);pointer-events:none;
}

.inner{position:relative;text-align:center}

/* ── eyebrow ───────────────────────────── */
.eyebrow{
  font-family:'Corm',serif;font-weight:500;
  font-size:clamp(10px,1.9vw,11.5px);
  letter-spacing:.46em;text-indent:.46em;
  color:var(--ivory);opacity:.92;
}

/* ── logo lockup ───────────────────────── */
.logo{margin-top:clamp(24px,4.6vw,33px)}
.logo img{display:block;margin:0 auto;height:auto}
.logo .mark{width:clamp(96px,19vw,124px)}
.logo .word{width:clamp(178px,35vw,222px);margin-top:clamp(16px,3.2vw,22px)}

/* ── signature: the mark's own sweep, redrawn as a rule ── */
.sweep{
  display:block;width:clamp(220px,52vw,300px);height:auto;
  margin:clamp(26px,5vw,35px) auto 0;overflow:visible;
}
.sweep path{fill:none;stroke:var(--white);stroke-width:1.1;stroke-linecap:round;opacity:.85}
.sweep .star{fill:var(--white);stroke:none;opacity:.95}

/* ── headline ──────────────────────────── */
.title{
  margin-top:clamp(24px,4.6vw,33px);
  font-weight:300;
  font-size:clamp(30px,7vw,42px);
  letter-spacing:.32em;text-indent:.32em;
  color:var(--white);
  line-height:1.2;
}
.lede{
  margin-top:clamp(18px,3.6vw,26px);
  font-weight:300;
  font-size:clamp(13.5px,2.7vw,15.5px);
  line-height:2.35;letter-spacing:.14em;
  color:var(--ivory);opacity:.92;
}

/* ── the date ──────────────────────────── */
.when{margin-top:clamp(28px,5.4vw,38px)}
.date{
  font-family:'Corm',serif;font-weight:300;
  font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;
  font-size:clamp(46px,11vw,68px);
  letter-spacing:.08em;text-indent:.08em;
  color:var(--white);line-height:1;
}
.date .dot{opacity:.5;padding:0 .06em}
.dow{
  margin-top:clamp(12px,2.4vw,16px);
  font-family:'Corm',serif;font-weight:500;
  font-size:clamp(10px,1.9vw,11.5px);
  letter-spacing:.44em;text-indent:.44em;
  color:var(--ivory);opacity:.8;
}

/* ── details ───────────────────────────── */
.rule{
  width:clamp(150px,36vw,210px);height:1px;
  margin:clamp(24px,4.6vw,31px) auto;
  background:var(--hair);
}
.row + .row{margin-top:clamp(17px,3.2vw,21px)}
.label{
  font-size:clamp(10px,1.9vw,11px);
  font-weight:400;
  letter-spacing:.34em;text-indent:.34em;
  color:var(--ivory);opacity:.66;
}
.value{
  margin-top:clamp(7px,1.4vw,10px);
  font-weight:300;
  font-size:clamp(15px,3vw,17.5px);
  letter-spacing:.1em;line-height:1.75;
  color:var(--white);
}
.value .num{font-family:'Corm',serif;font-weight:400;font-size:1.14em;letter-spacing:.05em;
  font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}

/* ── sign-off ──────────────────────────── */
.sign{
  margin-top:clamp(30px,5.6vw,39px);
  font-weight:300;
  font-size:clamp(13px,2.5vw,14.5px);
  letter-spacing:.24em;text-indent:.24em;
  color:var(--ivory);opacity:.9;
}

/* ── contact footer: two ways to reach the clinic ── */
.footrule{
  width:clamp(190px,44vw,260px);height:1px;
  margin:clamp(26px,4.8vw,34px) auto clamp(22px,4.2vw,28px);
  background:var(--hair);
}
.contact{display:flex;align-items:stretch;justify-content:center}
.contact .col{
  flex:0 0 clamp(142px,32vw,182px);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
}
.contact .col a{flex:1;display:flex;align-items:center;justify-content:center}
.contact .split{
  width:1px;flex:0 0 1px;align-self:center;
  height:clamp(96px,20vw,122px);background:var(--hair);
}
.qr img{
  display:block;box-sizing:content-box;
  width:111px;height:111px;
  background:#fff;border-radius:10px;padding:9px;
}
.contact .cap{
  margin-bottom:clamp(9px,1.8vw,12px);
  font-weight:400;
  font-size:clamp(10px,1.9vw,11px);
  letter-spacing:.3em;text-indent:.3em;
  color:var(--ivory);opacity:.66;
}
.contact .url{
  font-family:'Corm',serif;font-weight:400;
  font-size:clamp(14px,2.9vw,16.5px);
  letter-spacing:.09em;text-indent:.09em;
  color:var(--white);white-space:nowrap;
}
.contact a{text-decoration:none;color:inherit}
.cap .lat{font-family:'Corm',serif;font-weight:500;letter-spacing:.28em}
.contact a:focus-visible{outline:2px solid var(--white);outline-offset:4px}

/* ── actions (screen only) ─────────────── */
.actions{
  margin-top:clamp(26px,5vw,36px);
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
}
.actions a{
  font-family:'HanSerif',serif;font-weight:300;
  font-size:clamp(11.5px,2.2vw,13px);
  letter-spacing:.2em;text-indent:.2em;
  color:var(--ivory);text-decoration:none;
  padding:11px 22px;border:1px solid var(--hair);
  transition:background .35s ease,color .35s ease,border-color .35s ease;
}
.actions a:hover,.actions a:focus-visible{
  background:var(--white);border-color:var(--white);color:var(--olive-deep);
}
.actions a:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.print .actions{display:none}
.print .card{padding-bottom:clamp(42px,8vw,58px)}

/* ── entrance: the sweep is drawn, everything else settles ── */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spark{from{opacity:0;transform:scale(.4)}to{opacity:.95;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .anim .eyebrow,.anim .logo,.anim .title,.anim .lede,
  .anim .when,.anim .rule,.anim .row,.anim .sign,
  .anim .footrule,.anim .contact,.anim .actions{
